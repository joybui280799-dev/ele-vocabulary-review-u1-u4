<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Games Units 1–4</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:#f4f8fb;color:#1f2937;margin:0;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 70px}h1{text-align:center;color:#1e5fa8;font-size:28px;margin:0 0 4px}.sub{text-align:center;color:#6b7280;margin:0 0 16px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.tab{border:1px solid #b9c7d6;background:#fff;border-radius:20px;padding:8px 20px;font-weight:bold;cursor:pointer;color:#374151}.tab.on{background:#1e5fa8;border-color:#1e5fa8;color:#fff}
.hint{background:#fff8e1;border:1px solid #f0c94a;border-left:6px solid #f0b429;border-radius:6px;padding:12px 16px;margin-bottom:16px;font-style:italic}
.card{background:#fff;border:1px solid #e0e6ed;border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.no{font-weight:bold;color:#1e5fa8;width:26px}.letters{display:flex;gap:4px;flex-wrap:wrap}
.ch{width:30px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}
input.l{width:30px;height:38px;border:2px solid #b9c7d6;border-radius:6px;text-align:center;font-size:20px;font-weight:bold;text-transform:lowercase;padding:0;font-family:inherit;color:#1f2937}
input.l:focus{outline:none;border-color:#1e5fa8;background:#eaf2ff}input.l.ok{border-color:#2f8f6f;background:#e6f4ee}input.l.bad{border-color:#c0392b;background:#fdecea}
.mean{color:#6b7280;font-size:14px;margin-left:auto}
.topic{font-weight:bold;color:#1e5fa8;margin:18px 0 8px;font-size:17px}.bank{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bank span{background:#eef4fb;border:1px solid #b9c7d6;border-radius:16px;padding:3px 14px;font-weight:bold;font-size:14px}
.sent{background:#fff;border:1px solid #e0e6ed;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px}.sent .t{flex:1}.sent .line{margin:2px 0}
input.b{width:120px;border:none;border-bottom:2px solid #1e5fa8;background:#f4f8fb;font-size:16px;text-align:center;font-family:inherit;padding:1px 4px;margin:0 3px}
input.b.ok{border-color:#2f8f6f;background:#e6f4ee}input.b.bad{border-color:#c0392b;background:#fdecea}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e0e6ed;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px;box-shadow:0 -2px 6px rgba(0,0,0,.06)}
button.a{border:none;border-radius:22px;padding:10px 22px;font-weight:bold;font-size:15px;cursor:pointer}.check{background:#2f8f6f;color:#fff}.show{background:#e5e9ee;color:#374151}.reset{background:#fff;border:1px solid #b9c7d6;color:#374151}
.score{font-weight:bold;color:#1e5fa8;min-width:120px;text-align:center}
.sec{display:none}.sec.on{display:block}
</style></head><body><div class="wrap">
<h1>Vocabulary Games: Units 1–4</h1><p class="sub">Introductions and Names · Describing People · Clothes · Routines</p>
<div class="tabs"><button class="tab on" data-t="A">A. Missing Letters</button><button class="tab" data-t="B">B. Complete the Sentences</button></div>
<div class="sec on" id="A"><div class="hint">Type the missing letters. Each box is one letter. Use the Vietnamese meaning to help you.</div><div id="Alist"></div>
<div class="bar"><button class="a check" onclick="chk('A')">Check</button><button class="a show" onclick="rev('A')">Show answers</button><button class="a reset" onclick="rst('A')">Reset</button><span class="score" id="sA"></span></div></div>
<div class="sec" id="B"><div class="hint">Use the words in the box to complete each sentence. Type one word on each line.</div><div id="Blist"></div>
<div class="bar"><button class="a check" onclick="chk('B')">Check</button><button class="a show" onclick="rev('B')">Show answers</button><button class="a reset" onclick="rst('B')">Reset</button><span class="score" id="sB"></span></div></div>
</div>
<script>
const D={"A": [{"w": "reservation", "m": "sự đặt chỗ", "pat": ["r", "e", "_", "e", "_", "v", "_", "t", "i", "o", "_"]}, {"w": "comfortable", "m": "thoải mái", "pat": ["c", "_", "m", "_", "o", "_", "t", "a", "b", "_", "e"]}, {"w": "windbreaker", "m": "áo khoác gió", "pat": ["w", "_", "n", "d", "_", "r", "_", "a", "k", "e", "_"]}, {"w": "accounting", "m": "ngành kế toán", "pat": ["a", "_", "c", "_", "u", "_", "t", "i", "n", "_"]}, {"w": "assignment", "m": "bài tập, nhiệm vụ", "pat": ["a", "s", "s", "_", "g", "_", "m", "_", "n", "_"]}, {"w": "department", "m": "phòng ban, khoa", "pat": ["d", "_", "p", "a", "_", "t", "_", "e", "n", "_"]}, {"w": "university", "m": "trường đại học", "pat": ["u", "_", "i", "_", "e", "_", "s", "i", "_", "y"]}, {"w": "boyfriend", "m": "bạn trai", "pat": ["b", "_", "y", "_", "r", "_", "e", "_", "d"]}, {"w": "forgotten", "m": "đã quên", "pat": ["f", "_", "r", "g", "_", "t", "_", "e", "_"]}, {"w": "newspaper", "m": "tờ báo", "pat": ["n", "_", "w", "_", "p", "_", "p", "_", "r"]}, {"w": "semester", "m": "học kỳ", "pat": ["s", "e", "_", "e", "_", "t", "e", "_"]}, {"w": "register", "m": "đăng ký", "pat": ["r", "e", "_", "i", "_", "t", "e", "_"]}, {"w": "straight", "m": "(tóc) thẳng", "pat": ["s", "_", "r", "_", "i", "_", "h", "t"]}, {"w": "thirties", "m": "tuổi từ 30 đến 39", "pat": ["t", "_", "i", "r", "t", "_", "e", "_"]}, {"w": "twenties", "m": "tuổi từ 20 đến 29", "pat": ["t", "_", "e", "n", "_", "i", "e", "_"]}, {"w": "sneakers", "m": "giày thể thao", "pat": ["s", "n", "_", "a", "k", "_", "r", "_"]}, {"w": "earrings", "m": "hoa tai", "pat": ["e", "a", "_", "r", "i", "_", "g", "_"]}, {"w": "necklace", "m": "dây chuyền", "pat": ["n", "e", "_", "k", "_", "a", "c", "_"]}, {"w": "unusual", "m": "khác thường", "pat": ["u", "_", "u", "s", "_", "a", "_"]}, {"w": "actress", "m": "nữ diễn viên", "pat": ["a", "c", "_", "r", "_", "s", "_"]}], "B": [{"title": "Introductions and Names", "bank": ["spell", "meet", "number", "call", "minute"], "items": [{"s": "A: How do you ________ your last name?\nB: It's B-R-O-W-N.", "a": "spell"}, {"s": "Hello, Mr. Lee. It's nice to ________ you.", "a": "meet"}, {"s": "A: Can I have your phone ________?\nB: Sure. It's 0905 123 456.", "a": "number"}, {"s": "Please give me a ________ when you arrive at the university.", "a": "call"}, {"s": "Wait a ________. I need to find my pen.", "a": "minute"}]}, {"title": "Describing People", "bank": ["tall", "straight", "thirties", "curly", "cute"], "items": [{"s": "My brother is very ________. He is one meter ninety.", "a": "tall"}, {"s": "She has long, ________ hair. It has no waves.", "a": "straight"}, {"s": "My cousin is thirty-four, so she is in her ________.", "a": "thirties"}, {"s": "My niece has ________ hair. It has lots of waves.", "a": "curly"}, {"s": "Look at that baby! She is so ________.", "a": "cute"}]}, {"title": "Clothes", "bank": ["scarf", "try", "tight", "loose", "fit"], "items": [{"s": "It's cold today. Wear a ________ around your neck.", "a": "scarf"}, {"s": "A: Can I ________ on these jeans?\nB: Sure. The fitting room is over there.", "a": "try"}, {"s": "This shirt is too small. It's too ________ on me.", "a": "tight"}, {"s": "These pants are too big. They are too ________ on me.", "a": "loose"}, {"s": "I like this jacket, but it doesn't ________ me.", "a": "fit"}]}, {"title": "Routines", "bank": ["time", "up", "depends", "late", "shift"], "items": [{"s": "A: Do you have the ________?\nB: Yes. It's five past ten.", "a": "time"}, {"s": "I get ________ at six o'clock every morning.", "a": "up"}, {"s": "A: Do you like your job?\nB: It ________. Sometimes yes, sometimes no.", "a": "depends"}, {"s": "I often stay up ________ on weekends to watch videos.", "a": "late"}, {"s": "My father works the night ________ at a hospital.", "a": "shift"}]}]};const $=s=>document.querySelector(s);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t))});
$('#Alist').innerHTML=D.A.map((w,i)=>`<div class="card"><span class="no">${i+1}</span><div class="letters">${w.pat.map((c,k)=>c==='_'?`<input class="l" maxlength="1" data-i="${i}" data-a="${w.w[k]}" autocomplete="off" autocapitalize="off">`:`<span class="ch">${c}</span>`).join('')}</div><span class="mean">${w.m}</span></div>`).join('');
let n=0;$('#Blist').innerHTML=D.B.map(t=>`<div class="topic">${t.title}</div><div class="bank">${t.bank.map(b=>`<span>${b}</span>`).join('')}</div>`+t.items.map(it=>{n++;const lines=it.s.split('\n').map(l=>l.replace(/_{3,}/,`<input class="b" data-a="${it.a}" autocomplete="off" autocapitalize="off">`));return `<div class="sent"><span class="no">${n}</span><div class="t">${lines.map(l=>`<div class="line">${l}</div>`).join('')}</div></div>`}).join('')).join('');
const inputs=s=>[...document.querySelectorAll(s==='A'?'#Alist input':'#Blist input')];
document.querySelectorAll('input.l').forEach((el,k,all)=>{el.addEventListener('input',()=>{el.classList.remove('ok','bad');if(el.value&&all[k+1]&&all[k+1].dataset.i===el.dataset.i)all[k+1].focus()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&all[k-1]&&all[k-1].dataset.i===el.dataset.i)all[k-1].focus()})});
document.querySelectorAll('input.b').forEach(el=>el.addEventListener('input',()=>el.classList.remove('ok','bad')));
function chk(s){let ok=0,tot=0;if(s==='A'){const byW={};inputs('A').forEach(e=>{(byW[e.dataset.i]=byW[e.dataset.i]||[]).push(e)});Object.values(byW).forEach(es=>{tot++;let all=true;es.forEach(e=>{const g=e.value.trim().toLowerCase()===e.dataset.a;e.classList.toggle('ok',g);e.classList.toggle('bad',!g&&e.value!=='');if(!g)all=false});if(all)ok++})}
else inputs('B').forEach(e=>{tot++;const g=e.value.trim().toLowerCase()===e.dataset.a;e.classList.toggle('ok',g);e.classList.toggle('bad',!g&&e.value!=='');if(g)ok++});
$('#s'+s).textContent=`${ok} / ${tot} correct`+(ok===tot?' 🎉':'')}
function rev(s){inputs(s).forEach(e=>{e.value=e.dataset.a;e.classList.remove('bad');e.classList.add('ok')});chk(s)}
function rst(s){inputs(s).forEach(e=>{e.value='';e.classList.remove('ok','bad')});$('#s'+s).textContent=''}
</script></body></html>
